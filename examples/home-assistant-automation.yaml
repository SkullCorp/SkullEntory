# Réagir aux événements envoyés par un bouton de widget (action « Ping » du template)
# ou par le raccourci « Envoyer à une web app » (chemin /api/events/skullwidgets_widget).
alias: SkullWidgets – bouton widget
mode: queued
triggers:
  - trigger: event
    event_type: skullwidgets_widget
actions:
  - action: notify.notify
    data:
      message: "Widget SkullWidgets : {{ trigger.event.data.button | default('?') }}"
