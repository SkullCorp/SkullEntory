name: iOS – build IPA (sideload)

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "examples/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Outils (XcodeGen, ldid)
        run: brew install xcodegen ldid

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Version automatique : 1.0.<numéro du build>, publiée à chaque mise à jour.
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Génère le projet Xcode
        run: xcodegen generate

      - name: Compile (non signé)
        run: |
          set -o pipefail
          xcodebuild \
            -project SkullWidgets.xcodeproj \
            -scheme SkullWidgets \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*SkullWidgets|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { tail -80 build.log; exit 1; }

      - name: Pseudo-signature des entitlements + IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/SkullWidgets.app
          # AltStore/SideStore lisent les entitlements (App Group) dans la signature : on les injecte avec ldid.
          ldid -SWidget/SkullWidgetsWidget.entitlements "$APP/PlugIns/SkullWidgetsWidget.appex/SkullWidgetsWidget"
          ldid -SApp/SkullWidgets.entitlements "$APP/SkullWidgets"
          echo "--- entitlements app ---";    ldid -e "$APP/SkullWidgets"
          echo "--- entitlements widget ---"; ldid -e "$APP/PlugIns/SkullWidgetsWidget.appex/SkullWidgetsWidget"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry SkullWidgets.ipa Payload && rm -rf Payload)
          ls -la dist

      - name: Source AltStore / SideStore
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/make_source.py dist/SkullWidgets.ipa "$VERSION" "$GITHUB_REPOSITORY" "$TAG" > dist/altstore-source.json

      - uses: actions/upload-artifact@v4
        with:
          name: SkullWidgets-ipa
          path: dist/
          retention-days: 30

      - name: Release
        # Publiée automatiquement à chaque push sur la branche principale (ou sur un tag v*).
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SkullWidgets ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/SkullWidgets.ipa
            dist/altstore-source.json
