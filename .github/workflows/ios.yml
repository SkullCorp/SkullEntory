name: iOS – build IPA (sideload)

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "examples/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Outils (XcodeGen, ldid)
        run: brew install xcodegen ldid

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Génère le projet Xcode
        run: xcodegen generate

      - name: Compile (non signé)
        run: |
          set -o pipefail
          xcodebuild \
            -project SkullBridge.xcodeproj \
            -scheme SkullBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*SkullBridge|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { tail -80 build.log; exit 1; }

      - name: Pseudo-signature des entitlements + IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/SkullBridge.app
          # AltStore/SideStore lisent les entitlements (App Group) dans la signature : on les injecte avec ldid.
          ldid -SWidget/SkullBridgeWidget.entitlements "$APP/PlugIns/SkullBridgeWidget.appex/SkullBridgeWidget"
          ldid -SApp/SkullBridge.entitlements "$APP/SkullBridge"
          echo "--- entitlements app ---";    ldid -e "$APP/SkullBridge"
          echo "--- entitlements widget ---"; ldid -e "$APP/PlugIns/SkullBridgeWidget.appex/SkullBridgeWidget"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry SkullBridge.ipa Payload && rm -rf Payload)
          ls -la dist

      - name: Source AltStore / SideStore
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/make_source.py dist/SkullBridge.ipa "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > dist/altstore-source.json

      - uses: actions/upload-artifact@v4
        with:
          name: SkullBridge-ipa
          path: dist/
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SkullBridge.ipa
            dist/altstore-source.json
