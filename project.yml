name: SkullBridge
options:
  bundleIdPrefix: com.skullcorp
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SkullBridge:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SkullBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.skullcorp.skullbridge
            CFBundleURLSchemes: [skullbridge]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "SkullBridge contacte tes web apps et ton Home Assistant sur le réseau local."
        ALTAppGroups: [group.com.skullcorp.skullbridge]
    entitlements:
      path: App/SkullBridge.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.skullcorp.skullbridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skullcorp.skullbridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SkullBridgeWidget
    scheme: {}

  SkullBridgeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: SkullBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "SkullBridge contacte tes web apps et ton Home Assistant sur le réseau local."
        ALTAppGroups: [group.com.skullcorp.skullbridge]
    entitlements:
      path: Widget/SkullBridgeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.skullcorp.skullbridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skullcorp.skullbridge.widget
        SKIP_INSTALL: YES
